{% set name = "quantizer" %}
{% set version = "0.2.1" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/quantizer-{{ version }}.tar.gz
  sha256: 84dcea6783a9237028dd2a2caca31ba9ae95b3cf0c63b72dbf1199e7128e5368

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - matplotlib-base >=3.0
    - numba >=0.42
    - numpy >=1.15
    - python >={{ python_min }}
    - pyyaml >=5.1
    - scipy >=1.2
    - python-sounddevice >=0.4

test:
  imports:
    - quantizer
    - quantizer.kernel
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/ulrichtsblr/quantizer
  summary: an object-oriented audio synthesis framework
  license: GPL-3.0-or-later
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - bkalgard